services:
  - type: web
    name: goaltracker-web
    env: node
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: goaltracker-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://goaltracker-web.onrender.com

databases:
  - name: goaltracker-db
    databaseName: goaltracker
    user: goaltracker_user
